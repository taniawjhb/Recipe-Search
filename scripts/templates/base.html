<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipe Collection{% endblock %}</title>
  <link rel="stylesheet" href="{{ root }}styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ root }}index.html">Recipe Collection</a>
    <nav>
      <a href="{{ root }}index.html">Recipes</a>
      <a href="{{ root }}ingredients.html">Ingredients</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ counts.recipes }} recipes &middot; {{ counts.ingredients }} ingredients &middot; {{ counts.sources }} source files</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
