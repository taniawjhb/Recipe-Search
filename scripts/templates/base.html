<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipe Collection{% endblock %}</title>
  <link rel="stylesheet" href="{{ root }}styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ root }}index.html">Recipe Collection</a>
    <nav>
      <a href="{{ root }}index.html">Recipes</a>
      <a href="{{ root }}ingredients.html">Ingredients</a>
      <a href="{{ root }}menu.html">Menu<span data-menu-count></span></a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ counts.recipes }} recipes &middot; {{ counts.ingredients }} ingredients &middot; {{ counts.sources }} source files</p>
    <p>Recipes courtesy of <a href="https://www.thesecretjozichef.co.za/" target="_blank" rel="noopener noreferrer">The Secret Jozi Chef</a>.</p>
  </footer>
  <script src="{{ root }}menu.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
